<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">BFRES material reconstruction contact sheet</title>
  <desc id="description">Four sanitized diagrams show how the importer handles skin controls, target masks, two-color layer weights, and visible vertex tints.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c7a6"/>
      <stop offset="1" stop-color="#a96c55"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d95151"/>
      <stop offset="0.5" stop-color="#75d9df"/>
      <stop offset="1" stop-color="#2a6170"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f8a83"/>
      <stop offset="0.5" stop-color="#5a4d3d"/>
      <stop offset="1" stop-color="#362719"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#925c38"/>
      <stop offset="0.5" stop-color="#6f4329"/>
      <stop offset="1" stop-color="#4c2b1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { fill: #f7fafc; font: 700 42px Arial, sans-serif; }
      .subtitle { fill: #a9b8cf; font: 22px Arial, sans-serif; }
      .panel { fill: #111a2b; stroke: #33425d; stroke-width: 2; }
      .panel-title { fill: #f7fafc; font: 700 28px Arial, sans-serif; }
      .code { fill: #79c0ff; font: 700 20px Consolas, monospace; }
      .body { fill: #c9d4e5; font: 19px Arial, sans-serif; }
      .small { fill: #9fb0c8; font: 17px Arial, sans-serif; }
      .badge-control { fill: #5b2630; stroke: #e06c75; }
      .badge-tint { fill: #4a3c18; stroke: #e5c07b; }
      .badge-visible { fill: #163f32; stroke: #67c99a; }
      .badge-text { fill: #fff; font: 700 16px Arial, sans-serif; letter-spacing: 1px; }
      .arrow { stroke: #7185a3; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <text class="title" x="80" y="78">BFRES material reconstruction</text>
  <text class="subtitle" x="80" y="116">Sanitized reference sheet - no game textures or extracted assets</text>

  <g transform="translate(70 165)" filter="url(#shadow)">
    <rect class="panel" width="350" height="650" rx="24"/>
    <text class="panel-title" x="28" y="54">Skin controls</text>
    <text class="code" x="28" y="92">_th0 + packed _c0</text>
    <rect x="28" y="126" width="294" height="150" rx="18" fill="url(#skin)"/>
    <circle cx="102" cy="201" r="44" fill="#204b91"/>
    <path d="M75 186 L129 216 M129 186 L75 216" stroke="#ff7184" stroke-width="12" stroke-linecap="round"/>
    <path class="arrow" d="M175 300 V365 M160 350 L175 365 L190 350"/>
    <rect class="badge-control" x="28" y="390" width="294" height="48" rx="12"/>
    <text class="badge-text" x="175" y="421" text-anchor="middle">BYPASS CONTROL RGB</text>
    <text class="body" x="28" y="482">Keep the albedo as color.</text>
    <text class="body" x="28" y="514">Retain _c0 as metadata.</text>
    <text class="small" x="28" y="570">Decision source:</text>
    <text class="small" x="28" y="598">catalog control hint or</text>
    <text class="small" x="28" y="626">packed channel profile</text>
  </g>

  <g transform="translate(440 165)" filter="url(#shadow)">
    <rect class="panel" width="350" height="650" rx="24"/>
    <text class="panel-title" x="28" y="54">Region controls</text>
    <text class="code" x="28" y="92">_tgt0 + packed _c0</text>
    <rect x="28" y="126" width="294" height="150" rx="18" fill="url(#target)"/>
    <path d="M62 237 C115 142 205 271 290 160" stroke="#ffffff" stroke-opacity="0.8" stroke-width="12" fill="none"/>
    <path class="arrow" d="M175 300 V365 M160 350 L175 365 L190 350"/>
    <rect class="badge-control" x="28" y="390" width="294" height="48" rx="12"/>
    <text class="badge-text" x="175" y="421" text-anchor="middle">BYPASS CONTROL RGB</text>
    <text class="body" x="28" y="482">Do not turn region IDs</text>
    <text class="body" x="28" y="514">into visible green or cyan.</text>
    <text class="small" x="28" y="570">The texture binding and</text>
    <text class="small" x="28" y="598">classification reason remain</text>
    <text class="small" x="28" y="626">on the Blender material.</text>
  </g>

  <g transform="translate(810 165)" filter="url(#shadow)">
    <rect class="panel" width="350" height="650" rx="24"/>
    <text class="panel-title" x="28" y="54">Two-color tint</text>
    <text class="code" x="28" y="92">_a1 + grayscale _c0</text>
    <rect x="28" y="126" width="294" height="150" rx="18" fill="url(#wood)"/>
    <circle cx="78" cy="201" r="32" fill="#908b84" stroke="#fff" stroke-opacity="0.45"/>
    <circle cx="175" cy="201" r="32" fill="#625342" stroke="#fff" stroke-opacity="0.45"/>
    <circle cx="272" cy="201" r="32" fill="#342619" stroke="#fff" stroke-opacity="0.45"/>
    <path class="arrow" d="M175 300 V365 M160 350 L175 365 L190 350"/>
    <rect class="badge-tint" x="28" y="390" width="294" height="48" rx="12"/>
    <text class="badge-text" x="175" y="421" text-anchor="middle">INTERPOLATE COLORS</text>
    <text class="body" x="28" y="482">Mix ns_param_color0 and</text>
    <text class="body" x="28" y="514">ns_param_color1 by weight.</text>
    <text class="small" x="28" y="570">Then multiply the result</text>
    <text class="small" x="28" y="598">with the base albedo in a</text>
    <text class="small" x="28" y="626">labeled Blender node group.</text>
  </g>

  <g transform="translate(1180 165)" filter="url(#shadow)">
    <rect class="panel" width="350" height="650" rx="24"/>
    <text class="panel-title" x="28" y="54">Visible tint</text>
    <text class="code" x="28" y="92">RGB _c0, no control hint</text>
    <rect x="28" y="126" width="294" height="150" rx="18" fill="url(#rgb)"/>
    <path d="M45 245 L105 145 L165 245 L225 145 L305 245" fill="none" stroke="#f0c49d" stroke-opacity="0.55" stroke-width="13"/>
    <path class="arrow" d="M175 300 V365 M160 350 L175 365 L190 350"/>
    <rect class="badge-visible" x="28" y="390" width="294" height="48" rx="12"/>
    <text class="badge-text" x="175" y="421" text-anchor="middle">PRESERVE COLOR</text>
    <text class="body" x="28" y="482">Keep the standard glTF</text>
    <text class="body" x="28" y="514">base-color multiplication.</text>
    <text class="small" x="28" y="570">Unknown samplers are not</text>
    <text class="small" x="28" y="598">guessed; they are recorded</text>
    <text class="small" x="28" y="626">as unclassified metadata.</text>
  </g>

  <text class="small" x="800" y="865" text-anchor="middle">Classification is driven by data/material_semantics.json and recorded on every imported material.</text>
</svg>
